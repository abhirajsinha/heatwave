# Heatwave configuration — EVERYTHING here is optional.
#
# Out of the box, with this file untouched:
#   • every role runs on the model your session already uses (one model in
#     fresh contexts satisfies the isolation rules — R-12)
#   • test tooling is auto-detected from your project by the planner
#     (package.json, pytest.ini, go.mod, playwright/cypress configs,
#      ios/ & android/ folders, CI workflows — R-99)
#
# Edit only to OVERRIDE a default. Uncomment what you need.

# --- Models per role (default: the session's model for all three) ------------
# Use different models if you want uncorrelated blind spots between roles.
# RECOMMENDED (R-115): give the reviewer a different model FAMILY from the
# implementer — a same-model reviewer under-critiques its own style. The run
# record flags the gap either way: hetero_reviewer: "false (self-preference
# bias not mitigated)" when they match. Advisory only — zero-config stays valid.
# roles:
#   planner:     { preferred: your-best-reasoning-model, fallback: [] }
#   implementer: { preferred: your-best-coding-model,    fallback: [] }
#   reviewer:    { preferred: your-best-reasoning-model, fallback: [] }

# --- Test tooling (default: auto-detected from the project) ------------------
# Set an entry only when detection gets it wrong, or for tools that leave no
# trace in the repo (a load-test rig, a device farm). Never claim a tool you
# don't have — a false access claim is a Blocker (R-63).
# tooling:
#   unit: "jest"
#   integration: ""
#   web_e2e: "playwright"
#   load: "k6"
#   sast: "semgrep --config auto"    # STANDARD+ ladder rung (R-110); unset + undetected → NOT AVAILABLE, never silent
#   mutation: "npx stryker run"      # FULL ladder rung (R-110); scoped to changed modules; state a timeout
#   secrets: "gitleaks"           # FINAL_REVIEW rung (R-121); auto-detected (binary / .gitleaks.toml /
#                                 # pre-commit hook); a hit on the diff is a Blocker
#   ui_evidence: "playwright-mcp" # UI-evidence capture when change_surface ∋ ui (R-120); auto-when-present
#   docs: "context7-mcp"          # on-demand docs lookup at PLANNING (R-120); never always-on

# --- Dynamic security (v4-D, R-119) — OPT-IN; unset = disabled -----------------
# dynamic_security:
#   strix: disabled               # disabled | enabled. enabled fires ONLY when change_surface
#                                 # ∩ {auth, payments, external-input, new-endpoint} AND tier FULL.
#                                 # Docker spin-up → scan → tear-down, both recorded (R-119).
#   strix_target: ""              # target for `strix -n --target <...>` (URL or compose service)

# --- Mobile apps only --------------------------------------------------------
# ios | android | both. Leave unset to be asked once at the start of each
# mobile task (R-98).
# tooling:
#   mobile_platform: "both"

# --- Iteration budgets (defaults: 3 plan / 5 fix / 2 final — §2.3) -----------
# budgets:
#   plan_iterations: 3
#   fix_iterations: 5
#   final_iterations: 2

# --- Default tier when the planner doesn't argue otherwise (§0.5) ------------
# Rung-4 fallback of the intake cascade (R-103a): used only when a task is neither
# sensitive, EXPRESS-eligible, nor bounded-LIGHT. NOT a floor — it never suppresses
# the EXPRESS or LIGHT rungs.
# default_tier: STANDARD

# --- EXPRESS tier (§0.5, R-103) ----------------------------------------------
# express:
#   enabled: true
#   max_files: 2

# --- Technical design docs (STANDARD/FULL only, R-106) -----------------------
# design_doc: ask        # ask | always | never; unset = never for existing repos, ask for greenfield
# design_doc_path: docs/design

# --- Speed / token engine (v4, R-116–R-118) — ALL optional; unset = today's ---
# --- behavior: every stage on the session/role model, fresh contexts.      ---
# cheap_model: ""              # opt-in second model for MECHANICAL stages ONLY (R-116):
#                              # EXPRESS_CHECK, driver-side summarization, PLAN_REVIEW of
#                              # EXPRESS/LIGHT, TARGETED_REVIEW of a small delta. FULL_REVIEW,
#                              # FINAL_REVIEW, and PLAN_REVIEW of STANDARD/FULL always run the
#                              # frontier/role model — a config routing them to cheap_model is
#                              # rejected with a warning, never honored.
# small_diff_threshold: 150    # changed lines; TARGETED_REVIEW at/below this is cheap-eligible
#                              # (R-116). Default 150 when cheap_model is set and this is not.
# stage_models: {}             # per-stage overrides WITHIN R-116's sets — may narrow (route an
#                              # eligible stage back to the role model), never widen.
#   # EXPRESS_CHECK: <model-id>
#   # TARGETED_REVIEW: <model-id>
# fresh_final_reviewer: false  # true = always a cold FINAL_REVIEW context (R-117 escape hatch);
#                              # the R-117 safety clause holds either way: FINAL re-runs machine
#                              # evidence from scratch and re-confirms every AC.
