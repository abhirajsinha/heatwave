# Heatwave Run Record — append-only, maintained by the driver from START to terminal state.
# This file is the normative schema (v4 — formerly Appendix E of the rendered spec).

task_id:
created:
tier:                  # EXPRESS | LIGHT | STANDARD | FULL
terminal_state:        # APPROVED | ABANDONED (blank while active)
run_config:            # written by the driver at intake (core §2.5); absent in pre-v4 records — defaults apply
  tier: STANDARD           # EXPRESS | LIGHT | STANDARD | FULL — active
  tier_justification: ""   # one line, R-101 — active
  design_doc: false        # true | false — active (STANDARD/FULL only, R-106)
  change_class: feature    # v4: bugfix | feature — driver initial, PLANNER authoritative (R-114); absent = feature
  autonomy: autopilot      # RESERVED (G/H): autopilot | gated | interactive — recorded only, no branching (YAGNI)
  scope: single_repo       # RESERVED (G): single_repo | multi_repo — recorded only, no branching (YAGNI)
roles:
  planner:     { configured: , resolved: , substitution_reason: }
  implementer: { configured: , resolved: , substitution_reason: }
  reviewer:    { configured: , resolved: , substitution_reason: }
hetero_reviewer: ""      # v4 (R-115): "true" | "false (self-preference bias not mitigated)" — computed from roles.*.resolved once both implementer and reviewer have resolved (first FULL_REVIEW dispatch); SET this field in place (never append a new line or duplicate key — R-115); blank/absent = pre-v4-B record or not yet computed; advisory, never gates
review_session: ""       # v4-C (R-117): persistent | fresh-degraded | fresh-configured — set by the driver at the first post-implementation review dispatch; blank/absent = pre-C record (no session tracking)
final_delta_range: ""    # v4-C (R-118): "<last-full-sha>..<head-sha>" reviewed at FINAL_REVIEW; blank/absent = pre-C record or explicit full-scope degrade (degrade reason recorded in transitions)
counters:
  plan_iterations: 0
  fix_iterations: 0
  final_iterations: 0
tooling_resolutions:
  mobile_platform: ""      # ios | android | both — per R-98; blank for non-mobile tasks
  out_of_scope_platforms: []
companions:              # v4-D (R-119–R-121): companion activity; absent = pre-D record or none declared
  detected: []           #   from the plan's tooling declaration, e.g. [semgrep, gitleaks]
  fired: []              #   - { tool: , stage: , verdict: , evidence: }
  strix: ""              #   run | skipped-disabled | skipped-out-of-gate | NOT AVAILABLE (R-119)
  strix_docker_up: ""    #   timestamp — set only when strix ran (R-119)
  strix_docker_down: ""  #   timestamp — MUST be set whenever _up is set (R-119)
transitions: []
  # - { from: , to: , artifact: , timestamp: , stage_model: , head_sha: }   # stage_model v4-C (R-116): model that served the dispatch; head_sha v4-C (R-118): recorded on FULL_REVIEW transitions; both optional — absent = session model / no delta anchor
findings: []
  # - { id: , severity: , category: , introduced_iteration: , final_status: ,
  #     severity_changes: [], reopened_count: 0 }
deferrals: []
  # - { finding_id: , approved_by: , reason: , iteration: }
waivers: []
  # - { finding_id: , waived_by: OWNER, reason: , timestamp: }
scope_expansions: []
  # - { category: , trigger: , iteration: , deviation_declared: false }
deviations: []
  # - { id: , iteration: , declared: false, scope_impact: , threat_impact: }
unverified_criteria: []
  # - { ac_id: , reason: , waived: false }
escalations: []
  # - { trigger: , decision: , resume_state: , counters_reset: , timestamp: }
backlog: []
  # - { finding_id: , severity: , summary: }
